---
- name: Gather system metadata
  hosts: default
  gather_facts: true
  tasks:
    - name: Gather list of installed packages on RPM systems
      when: ansible_facts['os_family'] == 'RedHat'
      ansible.builtin.shell: |
        set -o pipefail
        rpm -qa | sort
      args:
        executable: /bin/bash
      register: installed_packages_rhel
      changed_when: false

    - name: Gather list of installed packages on Debian systems
      when: ansible_facts['os_family'] == 'Debian'
      ansible.builtin.shell: |
        set -o pipefail
        dpkg-query -W -f='${Package} ${Version}\n' | sort
      args:
        executable: /bin/bash
      register: installed_packages_deb
      changed_when: false

    - name: Build metadata dictionary
      ansible.builtin.set_fact:
        image_metadata:
          os:
            name: "{{ ansible_facts['distribution'] }}"
            version: "{{ ansible_facts['distribution_version'] }}"
          kernel: "{{ ansible_facts['kernel'] }}"
          installed_packages: >-
            {{
              (installed_packages_rhel.stdout_lines if ansible_facts['os_family'] == 'RedHat' else []) +
              (installed_packages_deb.stdout_lines if ansible_facts['os_family'] == 'Debian' else [])
            }}
          build_date: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"

    - name: Write metadata.json to disk
      ansible.builtin.copy:
        dest: /tmp/metadata.json
        content: "{{ image_metadata | to_nice_json }}"
...
